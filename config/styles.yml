styles:

  moody_cinematic_film:
    summary: "Moody Cinematic Film. Dark, grainy, atmospheric, 35mm film street and interior moments."
    categories: [morning, wisdom, love, mindfulness, goodnight, darkacademia, latenight, womenpower]
    weight: high
    description: >
      Moody, atmospheric, real-world street and interior photography. Grounded in reality but shot beautifully with a 35mm film aesthetic.
      Features dark night environments, wet streets, rain-streaked windows, quiet coffee shops, and low-key lighting.
      Colors are deep, desaturated, and cinematic. Ample dark negative space for readable text.
    rendering:
      font: inter
      font_variants: [inter, raleway, montserrat]
      text_color: "#FFFFFF"
      author_color: "#D4AF37"
      overlay: {type: gradient_bottom, opacity: 160, color: "#000000", blur: 0}
      text_zone: center_minimalist
      layout: asymmetric
      decoration: rule
      voice_gender: male

  cyberpunk_neon:
    summary: "Cyberpunk Neon. Moody rainy night with futuristic neon accents."
    categories: [morning, wisdom, love, mindfulness, goodnight, darkacademia, latenight, womenpower]
    weight: high
    description: >
      Futuristic street photography at night in the rain. High contrast dark scenes with reflective wet asphalt and glowing neon signs in cyan, magenta, and amber.
      Ample dark shadow space to keep the text overlay fully legible.
    rendering:
      font: montserrat
      font_variants: [montserrat, oswald, inter]
      text_color: "#FFFFFF"
      author_color: "#00FFFF"
      overlay: {type: gradient_bottom, opacity: 180, color: "#000000", blur: 0}
      text_zone: bottom_minimalist
      layout: big_center
      decoration: none
      voice_gender: female

  brutalist_minimalism:
    summary: "Brutalist Minimalism. Luxury concrete, clean lines, and soft architectural shadows."
    categories: [morning, wisdom, love, mindfulness, goodnight, darkacademia, latenight, womenpower]
    weight: high
    description: >
      Sleek, high-end minimalist architecture. Features neutral off-white concrete, clean lines, shadow plays from tropical leaves, linen textures, and warm wood accents.
      Very calming and high-end. Neutral palette (beige, warm gray, sand).
    rendering:
      font: playfair
      font_variants: [playfair, cormorant, lora]
      text_color: "#1A1A1A"
      author_color: "#666666"
      overlay: {type: glass, opacity: 200, color: "#F5F5F5", blur: 40}
      text_zone: center_minimalist
      layout: minimalist
      decoration: none
      voice_gender: female
