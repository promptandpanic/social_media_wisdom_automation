styles:

  quiet_luxury_noir:
    summary: "Quiet Luxury Noir. Dark desaturated high-contrast scenes, minimal high-fashion elements, deep shadows."
    categories: [morning, wisdom, love, mindfulness, goodnight, darkacademia, latenight, womenpower]
    weight: high
    enabled: false
    description: >
      Sleek, high-end quiet luxury and noir photography. Dark desaturated tones, minimal high-fashion elements (e.g. elegant dark coat, luxury watch, desaturated street/liminal space at night, luxury car interior at night), wet streets, quiet high-end libraries, and deep low-key cinematic shadows. Perfect for a clean, rich aesthetic. Ample dark negative space for readable white text.
    rendering:
      font: cormorant
      font_variants: [cormorant, playfair, lora, spectral, cinzel]
      text_color: "#FFFFFF"
      author_color: "#D4AF37"
      overlay: {type: gradient_bottom, opacity: 170, color: "#000000", blur: 0}
      text_zone: center_minimalist
      layout: minimalist
      decoration: none
      voice_gender: male

  vintage_cinematic_grain:
    summary: "Vintage Cinematic Grain. Nostalgic 90s film aesthetic, warm tones, and cinematic shadows."
    categories: [morning, wisdom, love, mindfulness, goodnight, darkacademia, latenight, womenpower]
    weight: high
    enabled: false
    description: >
      Warm vintage 35mm film street photography. Features classic film grain, nostalgic golden hour or warm interior lighting, soft retro reflections, vintage clothing, and candid cinematic moments. Beautifully textured and deeply personal. Colors are rich but faded.
    rendering:
      font: raleway
      font_variants: [raleway, montserrat, lora, inter]
      text_color: "#FDFCFA"
      author_color: "#E5A93B"
      overlay: {type: gradient_bottom, opacity: 160, color: "#0B0907", blur: 0}
      text_zone: center_minimalist
      layout: asymmetric
      decoration: none
      voice_gender: male

  warm_brutalist_minimal:
    summary: "Warm Brutalist Minimal. Clean luxury architecture, striking diagonal shadows, beige/sand tones."
    categories: [morning, wisdom, love, mindfulness, goodnight, darkacademia, latenight, womenpower]
    weight: high
    enabled: false
    description: >
      Luxurious modern brutalist architecture. Features warm off-white concrete, clean geometric lines, striking diagonal shadows cast by palm leaves, serene linen textures, and clear water ripples. Colors are warm neutrals (beige, cream, sand, muted gold, charcoal).
    rendering:
      font: jost
      font_variants: [jost, montserrat, outfit, inter]
      text_color: "#050505"
      author_color: "#444444"
      overlay: {type: glass, opacity: 200, color: "#F7F5F0", blur: 40}
      text_zone: center_minimalist
      layout: minimalist
      decoration: none
      voice_gender: female

  trendy_aesthetic_cartoon:
    summary: "Premium vibrant digital painting, cartoonish, and vector art mix. Light background, clean composition, dark text overlay, high viral appeal."
    categories: [morning, wisdom, love, mindfulness, goodnight, darkacademia, latenight, womenpower]
    weight: high
    description: >
      A premium, high-end artistic blend of modern digital painting, clean vector illustration, and trendy aesthetic cartooning. Features high-key bright lighting, smooth soft-color gradients, clean crisp vector outlines, and highly relatable expressive characters or premium lifestyle elements. Colors must be bright, light-filled, optimistic, and warm (strictly no dark, blackish, or low-contrast backgrounds). The scene must feature a vast, perfectly clean, high-key light background or negative space (such as soft off-white, light cream, or extremely light pastel color) that is entirely empty and free of any objects or busy textures, specifically designed for a dark text overlay to stand out clearly in a single color. Visually striking, premium-quality, and instantly viral.
    rendering:
      font: outfit
      font_variants: [outfit, poppins, nunito, jost, inter]
      text_color: "#050505"
      author_color: "#222222"
      overlay: {type: none, opacity: 0, color: "#FFFFFF", blur: 0}
      text_zone: center_minimalist
      layout: minimalist
      decoration: none
      voice_gender: female



